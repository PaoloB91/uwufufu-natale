<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>UWUFUFU DI NATALE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0f0f'/%3E%3Ctext x='8' y='46' font-family='Arial' font-weight='900' font-style='italic' font-size='36' fill='%23d32111'%3EV%3C/text%3E%3Ctext x='30' y='46' font-family='Arial' font-weight='900' font-style='italic' font-size='36' fill='%233b6ce6'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f0f0f; --card:#111; --pannello:#1a1a1a; --bordo:#2c2c2c; --testo:#ededed; --tenue:#9a9a9a;
  --rosso:#d32111; --rosso-banda:rgba(211,33,17,.72); --blu:#3b6ce6; --blu-banda:rgba(59,108,230,.72);
  --ciano:#41c7e8; --verde:#2fa84f; --oro:#f2c14e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--testo);font-family:Arial,Helvetica,sans-serif;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.app{max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}

/* Testata come nella partita di uwufufu */
.testata{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:6px 0 18px;position:relative}
.titolo{font-weight:800;font-size:clamp(22px,5.4vw,34px);letter-spacing:.3px;text-align:center}
.pillola{display:inline-flex;align-items:center;gap:8px;background:var(--pannello);border:1px solid var(--bordo);border-radius:999px;padding:7px 16px;font-size:15px;color:#cfcfcf}
.pillola b{color:var(--rosso);font-weight:700}
.pillola .sep{color:#555}
.chi{position:absolute;right:0;top:4px;font-size:12px;color:var(--tenue);text-align:right;max-width:30%}
.chi .regia{display:inline-block;background:#6d3fe0;color:#fff;border-radius:6px;padding:3px 7px;font-weight:700;margin-top:3px}
@media (max-width:640px){.chi{position:static;max-width:none;order:-1;display:flex;gap:8px;align-items:center}.chi br{display:none}.chi .regia{margin-top:0}}

/* Lo scontro */
.arena{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2.4vw,28px);align-items:start}
/* Altezza dal padding, non da aspect-ratio: su Safari iPhone la scheda (contenuto tutto assoluto)
   si schiacciava a zero (prova del 26/11/2026). */
.scheda{position:relative;border:6px solid var(--rosso);border-radius:12px;background:var(--card);overflow:hidden;
  transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .5s,filter .5s,box-shadow .3s;
  box-shadow:0 0 22px rgba(211,33,17,.45)}
.scheda::before{content:"";display:block;padding-top:133%}
.scheda.b{border-color:var(--blu);box-shadow:0 0 22px rgba(59,108,230,.5)}
@media (min-width:760px){.scheda::before{padding-top:82%}}
.scheda img,.scheda .vuota{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scheda .vuota{display:flex;align-items:center;justify-content:center;font-weight:900;font-style:italic;font-size:clamp(60px,16vw,150px);color:rgba(255,255,255,.14);
  background:radial-gradient(circle at 30% 20%,#2a1010,transparent 60%),radial-gradient(circle at 70% 80%,#0f1a2e,transparent 60%),#141414}
.banda{position:absolute;left:4%;right:4%;bottom:6%;transform:skewX(-12deg);background:var(--rosso-banda);padding:8px 12px;border-radius:3px}
.scheda.b .banda{background:var(--blu-banda)}
.banda span{display:block;transform:skewX(12deg);font-weight:800;font-style:italic;text-transform:uppercase;text-align:center;
  font-size:clamp(14px,3.6vw,22px);line-height:1.15;text-shadow:0 2px 4px rgba(0,0,0,.45);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.banda small{display:block;transform:skewX(12deg);text-align:center;font-size:clamp(10px,2.6vw,13px);opacity:.85;margin-top:2px;font-style:italic}
.scheda.cliccabile{cursor:pointer}
.scheda.cliccabile:active{transform:scale(.97)}
@media (hover:hover){.scheda.cliccabile:hover{transform:translateY(-4px)}}
.scheda.mia{outline:4px solid #fff;outline-offset:3px}
.scheda.spenta{opacity:.35;filter:grayscale(.8)}
.scheda.vince{transform:scale(1.06);z-index:2}
.scheda.perde{transform:scale(.88);opacity:.25;filter:grayscale(1)}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;
  font-weight:900;font-style:italic;font-size:clamp(54px,13vw,120px);letter-spacing:-.06em;line-height:1;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.vs .v{background:linear-gradient(180deg,#ff5a45,#b3150a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.25)}
.vs .s{background:linear-gradient(180deg,#7fa2ff,#2149c9);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.25)}

/* Barra di stato sotto le schede */
.stato{margin-top:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.grande{font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(20px,5vw,32px)}
.tenue{color:var(--tenue);font-size:14px}
.conta{font-size:15px;color:#cfcfcf}
.conta b{color:#fff}
.mancano{font-size:13px;color:var(--tenue);max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:10px;font-weight:700;font-size:17px;background:var(--ciano);color:#062530}
.btn.rosso{background:var(--rosso);color:#fff}
.btn.grigio{background:var(--pannello);border:1px solid var(--bordo);color:var(--testo)}
.btn:disabled{opacity:.4;cursor:default}
.esito{font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(22px,5.5vw,38px);animation:entra .5s cubic-bezier(.2,.9,.3,1.3)}
.esito .punti{display:block;font-size:.6em;color:#cfcfcf;margin-top:4px}
@keyframes entra{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* Timer del pareggio */
.velo{position:absolute;inset:-8px;z-index:4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  background:rgba(10,10,10,.78);backdrop-filter:blur(3px);border-radius:16px;text-align:center;padding:16px}
.timer{font-weight:900;font-size:clamp(80px,24vw,190px);line-height:1;font-variant-numeric:tabular-nums}
.timer.ultimi{color:var(--rosso);animation:batti 1s infinite}
@keyframes batti{50%{transform:scale(1.08)}}

/* Moneta */
.moneta-scena{perspective:900px;width:clamp(130px,34vw,200px);height:clamp(130px,34vw,200px);margin:8px auto}
.moneta{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 3s cubic-bezier(.15,.6,.2,1)}
.faccia{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-style:italic;font-size:clamp(20px,5vw,30px);color:#3b2a00;
  background:radial-gradient(circle at 35% 30%,#fff3c4,#f2c14e 45%,#b8860b 100%);box-shadow:inset 0 0 0 8px rgba(120,80,0,.35),0 10px 30px rgba(0,0,0,.5)}
.faccia.croce{transform:rotateY(180deg)}
.assegna{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.assegna div{background:var(--pannello);border:1px solid var(--bordo);border-radius:10px;padding:10px;font-size:14px}
.assegna b{display:block;font-size:17px;font-style:italic;text-transform:uppercase;margin-top:4px}
.assegna .ra{border-color:var(--rosso)} .assegna .rb{border-color:var(--blu)}

/* Ingresso, sala d'attesa, annunci */
.centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px 0}
.pannello{background:var(--pannello);border:1px solid var(--bordo);border-radius:14px;padding:20px;width:100%;max-width:520px}
.campo{width:100%;min-height:52px;border-radius:10px;border:1px solid var(--bordo);background:#0b0b0b;color:#fff;padding:0 14px;font-size:18px;margin:12px 0}
.campo:focus{outline:2px solid var(--ciano);border-color:transparent}
.logo{font-weight:900;font-style:italic;font-size:clamp(40px,12vw,84px);letter-spacing:-.03em;line-height:1}
.logo .r{color:var(--rosso)} .logo .b{color:var(--blu)}
.sotto{font-weight:800;font-style:italic;letter-spacing:.2em;color:#cfcfcf;margin-top:6px}
.elenco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;background:#0b0b0b;border:1px solid var(--bordo);border-radius:999px;padding:7px 12px;font-size:15px}
.chip.via{opacity:.4;text-decoration:line-through}
.chip button{font-size:12px;color:var(--tenue);text-decoration:underline;min-height:28px}
.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%}
.tess{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#151515;border:1px solid var(--bordo)}
.tess img{width:100%;height:100%;object-fit:cover}
.tess span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;font-size:12px;font-weight:700;font-style:italic;text-transform:uppercase;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.tess.dubbio{outline:2px dashed var(--oro)}
.avviso{color:var(--oro);font-size:14px}
.errore{color:#ff6b5a;font-size:15px}
h2{font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(22px,5.4vw,34px)}
.annuncio .num{font-weight:900;font-style:italic;font-size:clamp(70px,20vw,150px);line-height:.9;color:var(--rosso)}
.annuncio .num.b{color:var(--blu)}

/* Fine */
.trofeo::before{content:"";display:block;padding-top:133%}
.trofeo{position:relative;width:min(420px,86vw);border:6px solid var(--oro);border-radius:14px;overflow:hidden;box-shadow:0 0 50px rgba(242,193,78,.5);animation:entra .8s cubic-bezier(.2,.9,.3,1.3)}
.trofeo img,.trofeo .vuota{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trofeo .banda{background:rgba(185,135,20,.85)}
.tabella-voti{width:100%;overflow-x:auto;border:1px solid var(--bordo);border-radius:12px;background:var(--pannello)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bordo);text-align:left;vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:#202020;font-weight:700}
td.vin{color:var(--oro);font-weight:700}
.va{color:#ff7a6a} .vb{color:#86a6ff}
canvas#coriandoli{position:fixed;inset:0;pointer-events:none;z-index:20}
.nascosto{display:none!important}
</style>
</head>
<body>
<canvas id="coriandoli"></canvas>
<div class="app" id="app"><div class="centro"><div class="tenue">Caricamento...</div></div></div>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { initializeAuth, browserLocalPersistence, inMemoryPersistence, signInAnonymously, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, getDocs, query, where, writeBatch,
  updateDoc, runTransaction, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

// ---------- parametri del link ----------
const qs = new URLSearchParams(location.search);
const PID = qs.get('p') || 'natale-2026';
const CODICE = qs.get('c') || '';
const CODICE_REGIA = qs.get('r') || '';
const PROVA = qs.get('prova') === '1';
const SECONDI_TIMER = PROVA && qs.get('t') ? Math.max(3, +qs.get('t')) : 60;
const DURATA_LANCIO = 3200;     // ms di rotazione della moneta
const ATTESA_LANCIO = 4500;     // ms in cui si legge chi è testa e chi è croce

const fb = initializeApp(window.UWU_CONFIG);
const auth = initializeAuth(fb, { persistence: PROVA ? inMemoryPersistence : browserLocalPersistence });
const db = getFirestore(fb);
const base = (...p) => doc(db, 'partite', PID, ...p);
const col = (nome) => collection(db, 'partite', PID, nome);

// ---------- stato locale ----------
let UID = null, sonoRegia = false, sonoGiocatore = false;
let P = null;                    // documento partita
const R = new Map();             // ristoranti
const G = new Map();             // giocatori
const S = new Map();             // scontri
let VOTATO = [];                 // chi ha votato (senza la scelta)
let VOTI_FINALI = null;          // tutti i voti, solo a torneo finito
let vista = 'tabellone';         // a torneo finito: tabellone | voti
let ultimaChiave = '';
let occupato = false;

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const casuale = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const mescola = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = casuale(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const presenti = () => [...G.values()].filter(g => !g.assente);
const ristoranteOk = () => [...R.values()].filter(r => (r.stato || 'ok') === 'ok');

function nomeTurno(t, breve) {
  if (!t) return '';
  if (t.spareggi) return breve ? 'Spareggi' : 'Spareggi';
  const m = t.concorrenti;
  const n = {2: ['Finale', 'Finale'], 4: ['Semifinale', 'Semifinali'], 8: ['Quarti', 'Quarti di finale'],
             16: ['Ottavi', 'Ottavi di finale'], 32: ['Sedicesimi', 'Sedicesimi di finale']}[m];
  return n ? n[breve ? 0 : 1] : `Turno da ${m}`;
}

// ---------- avvio ----------
onAuthStateChanged(auth, async u => {
  if (!u) { try { await signInAnonymously(auth); } catch (e) { erroreFatale('Accesso non riuscito: ' + e.message); } return; }
  if (UID) return;
  UID = u.uid;
  await entra();
});

async function entra() {
  if (!CODICE && !CODICE_REGIA) return erroreFatale('Apri il link che ti è arrivato nel gruppo: questo è incompleto.');
  try { const g = await getDoc(base('giocatori', UID)); sonoGiocatore = g.exists(); } catch (e) { sonoGiocatore = false; }
  if (CODICE_REGIA) {
    try { await setDoc(base('regia', UID), { codice: CODICE_REGIA, quando: serverTimestamp() }); } catch (e) { /* già regia o codice errato */ }
    try { sonoRegia = (await getDoc(base('regia', UID))).exists(); } catch (e) { sonoRegia = false; }
  }
  if (!sonoGiocatore && !sonoRegia) return schermataNome();
  if (!sonoGiocatore && sonoRegia && !sessionStorageGet('solo-schermo')) return schermataNome();
  ascolta();
}

function sessionStorageGet(k) { try { return localStorage.getItem(`uwu-${PID}-${k}`); } catch (e) { return null; } }
function sessionStorageSet(k, v) { try { localStorage.setItem(`uwu-${PID}-${k}`, v); } catch (e) {} }

function erroreFatale(msg) {
  $app.innerHTML = `<div class="centro"><div class="logo"><span class="r">UWU</span><span class="b">FUFU</span></div>
    <div class="errore">${esc(msg)}</div></div>`;
}

function schermataNome(errore) {
  ultimaChiave = 'nome';
  $app.innerHTML = `<div class="centro">
    <div><div class="logo"><span class="r">UWU</span><span class="b">FUFU</span></div><div class="sotto">DI NATALE</div></div>
    <form class="pannello" id="fNome">
      <div style="font-weight:700;font-size:18px">Come ti chiami?</div>
      <input class="campo" id="nome" maxlength="24" autocomplete="nickname" placeholder="Il tuo nome" required>
      <button class="btn" style="width:100%">Entra</button>
      ${errore ? `<p class="errore" style="margin-top:12px">${esc(errore)}</p>` : ''}
      ${sonoRegia ? `<button type="button" class="btn grigio" id="soloSchermo" style="width:100%;margin-top:12px">Questo è solo lo schermo, non vota</button>` : ''}
    </form></div>`;
  document.getElementById('fNome').onsubmit = async ev => {
    ev.preventDefault();
    const nome = document.getElementById('nome').value.trim().slice(0, 24);
    if (!nome) return;
    try {
      await setDoc(base('giocatori', UID), { nome, codice: CODICE, assente: false, entrato: serverTimestamp() });
      sonoGiocatore = true; ascolta();
    } catch (e) { schermataNome(sonoRegia ? 'Per votare apri il link con il codice partita.' : 'Link non valido: chiedi quello giusto nel gruppo.'); }
  };
  const ss = document.getElementById('soloSchermo');
  if (ss) ss.onclick = () => { sessionStorageSet('solo-schermo', '1'); ascolta(); };
}

// ---------- ascolto del database ----------
let ascoltando = false;
function ascolta() {
  if (ascoltando) return; ascoltando = true;
  const errore = e => { console.error(e); };
  onSnapshot(base(), s => { P = s.exists() ? { id: s.id, ...s.data() } : null; aggiorna(); }, errore);
  onSnapshot(col('ristoranti'), q => { R.clear(); q.forEach(d => R.set(d.id, { id: d.id, ...d.data() })); aggiorna(); }, errore);
  onSnapshot(col('giocatori'), q => { G.clear(); q.forEach(d => G.set(d.id, { id: d.id, ...d.data() })); aggiorna(); }, errore);
  onSnapshot(col('scontri'), q => { S.clear(); q.forEach(d => S.set(d.id, { id: d.id, ...d.data() })); aggiorna(); }, errore);
  onSnapshot(col('votato'), q => { VOTATO = []; q.forEach(d => VOTATO.push(d.data())); aggiorna(); }, errore);
  setInterval(() => { aggiorna(true); }, 250);
}

function aggiorna(tick) {
  if (!P) { if (!tick) erroreFatale('Partita non trovata.'); return; }
  if (sonoRegia) regiaControlla();
  disegna(tick);
}

// ---------- la regia muove il torneo ----------
async function regiaControlla() {
  if (occupato || !P || P.stato !== 'gioco' || !P.scontroId) return;
  const s = S.get(P.scontroId);
  if (!s) return;
  if (s.fase === 'voto') {
    const pres = presenti();
    if (!pres.length) return;
    const fatti = new Set(VOTATO.filter(v => v.sid === s.id && v.t === s.tentativo).map(v => v.uid));
    if (pres.every(g => fatti.has(g.id))) await conta(s);
  } else if (s.fase === 'timer' && Date.now() >= s.timerFine) {
    await transizione(s.id, x => x.fase === 'timer' && x.tentativo === 1, { fase: 'voto', tentativo: 2 });
  }
}

async function transizione(sid, condizione, dati) {
  occupato = true;
  try {
    await runTransaction(db, async tr => {
      const ref = base('scontri', sid);
      const snap = await tr.get(ref);
      if (!snap.exists() || !condizione(snap.data())) return;
      tr.update(ref, typeof dati === 'function' ? dati(snap.data()) : dati);
    });
  } catch (e) { console.error(e); }
  finally { occupato = false; }
}

async function conta(s) {
  occupato = true;
  try {
    const q = await getDocs(query(col('voti'), where('sid', '==', s.id), where('t', '==', s.tentativo)));
    const n = { a: 0, b: 0 };
    q.forEach(d => { const sc = d.data().scelta; if (sc === 'a' || sc === 'b') n[sc]++; });
    occupato = false;
    await transizione(s.id, x => x.fase === 'voto' && x.tentativo === s.tentativo, x => {
      const conteggi = { ...(x.conteggi || {}), [s.tentativo]: n };
      if (n.a !== n.b) return { fase: 'svelato', vincitore: n.a > n.b ? 'a' : 'b', conteggi };
      if (s.tentativo === 1) return { fase: 'timer', timerFine: Date.now() + SECONDI_TIMER * 1000, conteggi };
      const testa = casuale(2) ? 'a' : 'b';
      const esce = casuale(2) ? 'testa' : 'croce';
      const vincitore = esce === 'testa' ? testa : (testa === 'a' ? 'b' : 'a');
      return { fase: 'moneta', conteggi, moneta: { testa, esce, lancio: Date.now() + ATTESA_LANCIO }, vincitore };
    });
  } catch (e) { console.error(e); occupato = false; }
}

function creaTurno(numero, concorrenti, batch) {
  const lista = mescola(concorrenti);
  const N = lista.length;
  let P2 = 1; while (P2 * 2 <= N) P2 *= 2;
  const nScontri = N === P2 ? N / 2 : N - P2;
  const inGioco = lista.slice(0, nScontri * 2);
  const passano = lista.slice(nScontri * 2);
  const ids = [];
  for (let i = 0; i < nScontri; i++) {
    const id = `t${numero}-${i + 1}`;
    ids.push(id);
    batch.set(base('scontri', id), { turno: numero, n: i + 1, di: nScontri, a: inGioco[2 * i], b: inGioco[2 * i + 1],
      tentativo: 1, fase: 'attesa', conteggi: {} });
  }
  return { scontri: ids, passano, spareggi: passano.length > 0, concorrenti: N };
}

async function inizia() {
  const ok = ristoranteOk().map(r => r.id);
  if (ok.length < 2) return;
  const batch = writeBatch(db);
  const t = creaTurno(1, ok, batch);
  batch.update(base(), { stato: 'gioco', turno: 1, turni: { 1: t }, fase: 'annuncio', scontroId: null, iniziata: serverTimestamp() });
  await batch.commit();
}

async function via() {
  const t = P.turni[P.turno];
  const id = t.scontri[0];
  const batch = writeBatch(db);
  batch.update(base('scontri', id), { fase: 'voto' });
  batch.update(base(), { fase: 'scontro', scontroId: id });
  await batch.commit();
}

async function prossimo() {
  const t = P.turni[P.turno];
  const i = t.scontri.indexOf(P.scontroId);
  if (i < t.scontri.length - 1) {
    const id = t.scontri[i + 1];
    const batch = writeBatch(db);
    batch.update(base('scontri', id), { fase: 'voto' });
    batch.update(base(), { scontroId: id });
    return batch.commit();
  }
  const vincitori = t.scontri.map(id => { const s = S.get(id); return s[s.vincitore]; }).concat(t.passano);
  const batch = writeBatch(db);
  if (vincitori.length === 1) {
    batch.update(base(), { stato: 'finito', vincitore: vincitori[0], scontroId: null, fase: 'fine', finita: serverTimestamp() });
  } else {
    const n = P.turno + 1;
    const nuovo = creaTurno(n, vincitori, batch);
    batch.update(base(), { turno: n, [`turni.${n}`]: nuovo, fase: 'annuncio', scontroId: null });
  }
  await batch.commit();
}

async function vota(s, scelta) {
  if (!sonoGiocatore || s.fase !== 'voto') return;
  const id = `${s.id}_${s.tentativo}_${UID}`;
  if (VOTATO.some(v => v.sid === s.id && v.t === s.tentativo && v.uid === UID)) return;
  const batch = writeBatch(db);
  batch.set(base('votato', id), { sid: s.id, t: s.tentativo, uid: UID });
  batch.set(base('voti', id), { sid: s.id, t: s.tentativo, uid: UID, scelta });
  sessionStorageSet(`mio-${UID}-${s.id}-${s.tentativo}`, scelta);
  try { await batch.commit(); } catch (e) { console.error(e); }
  aggiorna();
}

// ---------- disegno ----------
function testata(pillola) {
  const io = G.get(UID);
  return `<div class="testata">
    <div class="titolo">UWUFUFU DI NATALE</div>
    ${pillola ? `<div class="pillola">${pillola}</div>` : ''}
    <div class="chi">${io ? esc(io.nome) : (sonoRegia ? 'schermo' : '')}${sonoRegia ? '<br><span class="regia">REGIA</span>' : ''}</div>
  </div>`;
}

function foto(r) {
  return r?.foto ? `<img src="${r.foto}" alt="">` : `<div class="vuota">${esc((r?.nome || '?').trim()[0] || '?')}</div>`;
}

function scheda(r, lato, classi = '') {
  return `<div class="scheda ${lato} ${classi}" data-lato="${lato}">${foto(r)}
    <div class="banda"><span>${esc(r?.nome || '?')}</span>${r?.citta ? `<small>${esc(r.citta)}</small>` : ''}</div></div>`;
}

function disegna(tick) {
  if (P.stato === 'attesa') return disegnaAttesa(tick);
  if (P.stato === 'finito') return disegnaFine(tick);
  if (P.fase === 'annuncio' || !P.scontroId) return disegnaAnnuncio(tick);
  return disegnaScontro(tick);
}

function chiave(k) { if (k === ultimaChiave) return false; ultimaChiave = k; return true; }

function disegnaAttesa() {
  const gioc = [...G.values()].sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  const rist = [...R.values()].sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  const ok = ristoranteOk();
  const dubbi = rist.filter(r => r.stato === 'da-verificare');
  const k = 'attesa|' + JSON.stringify([gioc.map(g => [g.id, g.nome, g.assente]), rist.map(r => [r.id, r.stato, r.nome, !!r.foto])]);
  if (!chiave(k)) return;
  $app.innerHTML = testata('Sala d\'attesa') + `<div class="centro" style="justify-content:flex-start">
    <div class="pannello">
      <div style="font-weight:700;margin-bottom:10px">Collegati: ${presenti().length}</div>
      <div class="elenco">${gioc.map(g => `<span class="chip ${g.assente ? 'via' : ''}">${esc(g.nome)}${g.id === UID ? ' (tu)' : ''}
        ${sonoRegia ? `<button data-assente="${g.id}">${g.assente ? 'rimetti' : 'togli'}</button>` : ''}</span>`).join('') || '<span class="tenue">Ancora nessuno</span>'}</div>
    </div>
    <div style="width:100%">
      <div class="annuncio"><div class="num">${ok.length}</div></div>
      <h2 style="margin-bottom:8px">ristoranti in gara</h2>
      <p class="tenue">Quali sono si scopre scontro dopo scontro.</p>
      ${sonoRegia && dubbi.length ? `<p class="avviso" style="margin-top:10px">${dubbi.length} da sistemare: chiedi a Claude.</p>` : ''}
    </div>
    ${sonoRegia ? `<button class="btn rosso" id="inizia" ${ok.length < 2 || !presenti().length ? 'disabled' : ''}>Inizia l'Uwufufu</button>`
      : `<p class="tenue">Si parte quando la regia preme "Inizia".</p>`}
  </div>`;
  $app.querySelectorAll('[data-assente]').forEach(b => b.onclick = () => {
    const g = G.get(b.dataset.assente); updateDoc(base('giocatori', g.id), { assente: !g.assente });
  });
  const bi = document.getElementById('inizia'); if (bi) bi.onclick = () => { bi.disabled = true; inizia(); };
}

function disegnaAnnuncio() {
  const t = P.turni?.[P.turno];
  if (!t) return;
  const k = `annuncio|${P.turno}|${R.size}`;
  if (!chiave(k)) return;
  const pass = t.passano.map(id => R.get(id)?.nome).filter(Boolean);
  $app.innerHTML = testata(esc(nomeTurno(t, true))) + `<div class="centro annuncio">
    <div class="num ${P.turno % 2 ? '' : 'b'}">${t.concorrenti}</div>
    <h2>${esc(nomeTurno(t))}</h2>
    <p class="tenue">${t.scontri.length} ${t.scontri.length === 1 ? 'scontro' : 'scontri'}${t.spareggi ? ' per arrivare a un tabellone pulito' : ''}</p>
    ${pass.length ? `<div class="pannello"><div style="font-weight:700;margin-bottom:10px">Passano direttamente al turno dopo</div>
      <div class="elenco">${pass.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div></div>` : ''}
    ${sonoRegia ? `<button class="btn rosso" id="via">Via!</button>` : `<p class="tenue">Aspetta la regia...</p>`}
  </div>`;
  const b = document.getElementById('via'); if (b) b.onclick = () => { b.disabled = true; via(); };
}

function disegnaScontro(tick) {
  const s = S.get(P.scontroId);
  if (!s) return;
  const t = P.turni[s.turno];
  const ra = R.get(s.a), rb = R.get(s.b);
  const fatti = VOTATO.filter(v => v.sid === s.id && v.t === s.tentativo);
  const mioVoto = fatti.some(v => v.uid === UID) ? (sessionStorageGet(`mio-${UID}-${s.id}-${s.tentativo}`) || '?') : null;
  const ora = Date.now();
  let sotto = s.fase;
  if (s.fase === 'moneta') sotto = ora < s.moneta.lancio ? 'moneta-assegna' : ora < s.moneta.lancio + DURATA_LANCIO + 400 ? 'moneta-lancio' : 'moneta-esito';
  const pres = presenti();
  const k = ['scontro', s.id, s.tentativo, sotto, mioVoto, fatti.length, pres.map(g => g.id + g.nome).join(','), s.vincitore || '', !!ra, !!rb, !!G.get(UID)].join('|');
  if (!chiave(k)) { aggiornaDinamico(s); return; }

  const pill = `${esc(nomeTurno(t, true))} <span class="sep">|</span> <span><b>${s.n}</b>/${s.di}</span>`;
  let ca = '', cb = '', velo = '', stato = '';
  const nome = l => esc((l === 'a' ? ra : rb)?.nome || '?');

  if (s.fase === 'voto') {
    const puoVotare = sonoGiocatore && !mioVoto && !G.get(UID)?.assente;
    ca = puoVotare ? 'cliccabile' : mioVoto ? (mioVoto === 'a' ? 'mia' : 'spenta') : '';
    cb = puoVotare ? 'cliccabile' : mioVoto ? (mioVoto === 'b' ? 'mia' : 'spenta') : '';
    const mancano = pres.filter(g => !fatti.some(v => v.uid === g.id))
      .map(g => esc(g.nome) + (sonoRegia && g.id !== UID ? ` <button class="togli" data-assente="${g.id}" style="text-decoration:underline;font-size:12px;min-height:32px">togli</button>` : ''));
    stato = `${s.tentativo === 2 ? '<div class="grande" style="color:var(--oro)">Si rivota!</div>' : ''}
      ${puoVotare ? '<div class="grande">Tocca il tuo preferito</div>' : mioVoto ? '<div class="grande">Voto registrato</div>' : ''}
      <div class="conta"><b>${fatti.length}</b> su <b>${pres.length}</b> hanno votato</div>
      ${mancano.length ? `<div class="mancano">Mancano: ${mancano.join(', ')}</div>` : ''}`;
  } else if (s.fase === 'timer') {
    const c = s.conteggi?.[1] || { a: 0, b: 0 };
    velo = `<div class="velo"><div class="grande">Pareggio ${c.a} a ${c.b}</div>
      <div class="timer" id="timer">${Math.max(0, Math.ceil((s.timerFine - ora) / 1000))}</div>
      <div class="tenue">Discutete, poi si rivota</div></div>`;
  } else if (sotto === 'moneta-assegna' || sotto === 'moneta-lancio') {
    const testa = s.moneta.testa, croce = testa === 'a' ? 'b' : 'a';
    velo = `<div class="velo">
      <div class="grande">${sotto === 'moneta-assegna' ? 'Ancora pari: decide la moneta' : 'Lancio!'}</div>
      <div class="assegna"><div class="r${testa}">Testa<b>${nome(testa)}</b></div><div class="r${croce}">Croce<b>${nome(croce)}</b></div></div>
      <div class="moneta-scena"><div class="moneta" id="moneta"><div class="faccia testa">TESTA</div><div class="faccia croce">CROCE</div></div></div>
    </div>`;
  } else {
    const v = s.vincitore, ultimo = s.conteggi?.[s.tentativo] || { a: 0, b: 0 };
    ca = v === 'a' ? 'vince' : 'perde'; cb = v === 'b' ? 'vince' : 'perde';
    const dettaglio = s.fase === 'moneta' ? `vince a ${s.moneta.esce}` : `vince ${ultimo[v]} a ${ultimo[v === 'a' ? 'b' : 'a']}`;
    const t2 = P.turni[s.turno];
    const ultimoTurno = t2.scontri[t2.scontri.length - 1] === s.id;
    const finale = ultimoTurno && t2.scontri.length === 1 && t2.passano.length === 0;
    stato = `<div class="esito">${nome(v)}<span class="punti">${dettaglio}</span></div>
      ${sonoRegia ? `<button class="btn rosso" id="prossimo">${finale ? 'Proclama il vincitore' : ultimoTurno ? 'Turno successivo' : 'Prossimo scontro'}</button>` : ''}`;
    if (!tick) setTimeout(() => sparaCoriandoli(40), 200);
  }

  $app.innerHTML = testata(pill) + `<div class="arena">${scheda(ra, 'a', ca)}${scheda(rb, 'b', cb)}
    <div class="vs"><span class="v">V</span><span class="s">S</span></div>${velo}</div>
    <div class="stato">${stato}</div>`;

  if (s.fase === 'voto') $app.querySelectorAll('.scheda.cliccabile').forEach(el => el.onclick = () => vota(s, el.dataset.lato));
  $app.querySelectorAll('[data-assente]').forEach(b => b.onclick = () => updateDoc(base('giocatori', b.dataset.assente), { assente: true }));
  const bp = document.getElementById('prossimo'); if (bp) bp.onclick = () => { bp.disabled = true; prossimo(); };
  if (sotto === 'moneta-lancio') {
    const m = document.getElementById('moneta');
    const giri = 360 * 7 + (s.moneta.esce === 'croce' ? 180 : 0);
    const trascorso = ora - s.moneta.lancio;
    m.style.transition = `transform ${Math.max(200, DURATA_LANCIO - trascorso)}ms cubic-bezier(.15,.6,.2,1)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { m.style.transform = `rotateY(${giri}deg)`; }));
  }
}

function aggiornaDinamico(s) {
  if (s.fase === 'timer') {
    const el = document.getElementById('timer');
    if (el) { const sec = Math.max(0, Math.ceil((s.timerFine - Date.now()) / 1000)); el.textContent = sec; el.classList.toggle('ultimi', sec <= 10); }
  }
}

async function disegnaFine() {
  const k = `fine|${vista}|${VOTI_FINALI ? VOTI_FINALI.length : 'x'}|${R.size}|${G.size}|${S.size}`;
  if (!chiave(k)) return;
  const r = R.get(P.vincitore);
  if (vista === 'voti') return disegnaVoti();
  $app.innerHTML = testata('Vincitore') + `<div class="centro">
    <h2 style="color:var(--oro)">Si va qui per la cena di Natale</h2>
    <div class="trofeo">${foto(r)}<div class="banda"><span>${esc(r?.nome || '?')}</span>${r?.citta ? `<small>${esc(r.citta)}</small>` : ''}</div></div>
    <button class="btn grigio" id="vediVoti">Vedi i voti di tutti</button></div>`;
  document.getElementById('vediVoti').onclick = async () => {
    vista = 'voti';
    if (!VOTI_FINALI) { const q = await getDocs(col('voti')); VOTI_FINALI = []; q.forEach(d => VOTI_FINALI.push(d.data())); }
    aggiorna();
  };
  sparaCoriandoli(220);
}

function disegnaVoti() {
  const gioc = [...G.values()].sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  const scontri = [...S.values()].filter(s => s.vincitore).sort((a, b) => a.turno - b.turno || a.n - b.n);
  const voto = (sid, t, uid) => VOTI_FINALI.find(v => v.sid === sid && v.t === t && v.uid === uid)?.scelta;
  const breve = id => esc(R.get(id)?.nome || '?');
  const righe = scontri.map(s => {
    const celle = gioc.map(g => {
      const v1 = voto(s.id, 1, g.id), v2 = voto(s.id, 2, g.id);
      const f = v => v ? `<span class="v${v}">${breve(s[v])}</span>` : '<span class="tenue">-</span>';
      return `<td>${f(v1)}${s.conteggi?.[2] ? ` → ${f(v2)}` : ''}</td>`;
    }).join('');
    const extra = s.fase === 'moneta' ? ' (moneta)' : s.conteggi?.[2] ? ' (rivoto)' : '';
    return `<tr><td>${esc(nomeTurno(P.turni[s.turno], true))} ${s.n}</td>
      <td><span class="va">${breve(s.a)}</span> vs <span class="vb">${breve(s.b)}</span></td>
      <td class="vin">${breve(s[s.vincitore])}${extra}</td>${celle}</tr>`;
  }).join('');
  $app.innerHTML = testata('I voti di tutti') + `<div class="centro" style="justify-content:flex-start">
    <div class="tabella-voti"><table><thead><tr><th>Turno</th><th>Scontro</th><th>Passa</th>${gioc.map(g => `<th>${esc(g.nome)}</th>`).join('')}</tr></thead>
    <tbody>${righe}</tbody></table></div>
    <p class="tenue">Nei pareggi: primo voto → voto dopo il timer.</p>
    <button class="btn grigio" id="indietro">Torna al vincitore</button></div>`;
  document.getElementById('indietro').onclick = () => { vista = 'tabellone'; aggiorna(); };
}

// ---------- coriandoli ----------
const cv = document.getElementById('coriandoli'), cx = cv.getContext('2d');
let pezzi = [], animando = false;
function sparaCoriandoli(n) {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const col = ['#d32111', '#3b6ce6', '#f2c14e', '#ffffff', '#2fa84f'];
  for (let i = 0; i < n; i++) pezzi.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 4,
    vy: 2 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: col[i % col.length], w: 6 + Math.random() * 8 });
  if (!animando) { animando = true; requestAnimationFrame(passo); }
}
function passo() {
  cx.clearRect(0, 0, cv.width, cv.height);
  pezzi = pezzi.filter(p => p.y < cv.height + 30);
  for (const p of pezzi) {
    p.x += p.vx; p.y += p.vy * devicePixelRatio; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); cx.restore();
  }
  if (pezzi.length) requestAnimationFrame(passo); else { animando = false; cx.clearRect(0, 0, cv.width, cv.height); }
}
</script>
